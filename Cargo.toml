[package]
name = "cockatiel_reprimand"
version = "0.1.0"
edition = "2021"
description = "Cockatiel module — chat-command reprimand (24h cooldown per giver->recipient, enforced in the user DB)"
license = "GPL-2.0"

[dependencies]
cockatiel-client = { git = "https://github.com/vulbyte/cockatiel_client-rs", rev = "59920409d5643942c94a23753febcaa0c3a9817e" }
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
prost = "0.14"
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
